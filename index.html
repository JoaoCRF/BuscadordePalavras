<!DOCTYPE html>
<!-- Versão 5.0 -->
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Buscador de Palavras Avançado</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .painel-avancado {
            background: #fff;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid #ddd;
            margin-bottom: 20px;
        }
        .tamanho-seletor {
            display: flex;
            gap: 5px;
            justify-content: center;
            margin-bottom: 15px;
            align-items: center;
            flex-wrap: wrap;
        }
        .posicoes-container {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }
        .input-posicao {
            width: 35px;
            height: 35px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            text-transform: uppercase;
            border: 2px solid #007BFF;
            border-radius: 4px;
            background-color: #f8f9fa;
        }
        .input-posicao:focus {
            background-color: #fff;
            outline: none;
            box-shadow: 0 0 5px rgba(0, 123, 255, 0.5);
        }
        .instrucao-casas {
            text-align: center;
            font-size: 14px;
            color: #555;
            margin-bottom: 10px;
        }
        #input-letras {
            font-weight: bold;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Buscador de Palavras</h1>
        
        <div id="status-carregamento" class="contador">Carregando dicionário... Aguarde.</div>

        <div id="busca-container" style="display: none;">
            
            <!-- 1. Entrada de Letras Disponíveis -->
            <div class="form-grupo">
                <input type="text" id="input-letras" placeholder="EX: CALLCOU (Letras disponíveis)" maxlength="7" autocomplete="off">
            </div>

            <!-- 2. Painel de Busca Avançada (3 a 7 letras + Sem Fixo) -->
            <div class="painel-avancado">
                <div class="tamanho-seletor">
                    <span><strong>Tamanho:</strong></span>
                    <button class="filtro-btn" onclick="selecionarTamanho(3)">3</button>
                    <button class="filtro-btn" onclick="selecionarTamanho(4)">4</button>
                    <button class="filtro-btn" onclick="selecionarTamanho(5)">5</button>
                    <button class="filtro-btn" onclick="selecionarTamanho(6)">6</button>
                    <button class="filtro-btn" onclick="selecionarTamanho(7)">7</button>
                    <button class="filtro-btn" id="btn-sem-fixo" onclick="filtrarTamanhoTodas()" style="background-color: #6c757d; color: white; margin-left: 5px;">Sem tamanho fixo</button>
                </div>

                <div id="secao-posicoes" style="display: none;">
                    <div class="instrucao-casas">Preencha as letras nas posições desejadas (deixe em branco o que não importar):</div>
                    <div id="posicoes-container" class="posicoes-container">
                        <!-- As caixinhas dinâmicas aparecem aqui -->
                    </div>
                </div>
            </div>

            <div class="form-grupo">
                <button id="btn-buscar" onclick="executarBusca()">Buscar</button>
            </div>

            <div id="contador-resultados" class="contador"></div>
            <ul id="lista-resultados"></ul>
        </div>
    </div>

    <script>
        let listaPalavras = [];
        let tamanhoSelecionado = null; 

        // =====================================================================
        // 📂 EDIÇÃO DO ARQUIVO: Mantenha o nome do seu arquivo aqui
        // =====================================================================
        const NOME_DO_ARQUIVO = "palavras.txt"; 

        function removerAcentos(texto) {
            return texto.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
        }

        async function carregarDicionario() {
            try {
                const resposta = await fetch(NOME_DO_ARQUIVO);
                if (!resposta.ok) throw new Error("Arquivo não encontrado");
                
                const texto = await resposta.text();
                const linhas = texto.split(/\r?\n/);

                for (let linha of linhas) {
                    const original = linha.trim();
                    if (original) {
                        const limpa = removerAcentos(original).toLowerCase();
                        listaPalavras.push({
                            original: original,
                            limpa: limpa,
                            contador: criarContador(limpa),
                            tamanho: limpa.length
                        });
                    }
                }

                document.getElementById('status-carregamento').style.display = 'none';
                document.getElementById('busca-container').style.display = 'block';
                document.getElementById('input-letras').focus();
                
                selecionarTamanho(3);
            } catch (erro) {
                document.getElementById('status-carregamento').innerText = 
                    "Erro ao carregar o arquivo. Verifique se 'palavras.txt' está na pasta.";
                console.error(erro);
            }
        }

        function criarContador(palavra) {
            const contador = {};
            for (let char of palavra) {
                contador[char] = (contador[char] || 0) + 1;
            }
            return contador;
        }

        function selecionarTamanho(tamanho) {
            tamanhoSelecionado = tamanho;

            const botoes = document.querySelectorAll('.tamanho-seletor .filtro-btn');
            botoes.forEach(b => {
                if(b.textContent == tamanho) {
                    b.classList.add('ativo');
                    b.style.backgroundColor = '#28a745';
                    b.style.color = 'white';
                } else if(b.textContent !== 'Sem tamanho fixo') {
                    b.classList.remove('ativo');
                    b.style.backgroundColor = '#e0e0e0';
                    b.style.color = '#333';
                }
            });

            document.getElementById('btn-sem-fixo').style.backgroundColor = '#6c757d';
            document.getElementById('btn-sem-fixo').style.color = 'white';

            document.getElementById('secao-posicoes').style.display = 'block';
            const container = document.getElementById('posicoes-container');
            container.innerHTML = '';

            for (let i = 0; i < tamanho; i++) {
                const input = document.createElement('input');
                input.type = 'text';
                input.maxLength = 1;
                input.className = 'input-posicao';
                input.id = `pos_${i}`;
                input.addEventListener('input', function() {
                    if (this.value.length >= 1) {
                        const proximo = document.getElementById(`pos_${i + 1}`);
                        if (proximo) proximo.focus();
                    }
                });
                container.appendChild(input);
            }
        }

        function filtrarTamanhoTodas() {
            tamanhoSelecionado = null;
            document.getElementById('secao-posicoes').style.display = 'none';
            
            const botoes = document.querySelectorAll('.tamanho-seletor .filtro-btn');
            botoes.forEach(b => {
                if(b.textContent !== 'Sem tamanho fixo') {
                    b.classList.remove('ativo');
                    b.style.backgroundColor = '#e0e0e0';
                    b.style.color = '#333';
                }
            });

            document.getElementById('btn-sem-fixo').style.backgroundColor = '#28a745';
        }

        function executarBusca() {
            const inputLetras = document.getElementById('input-letras').value.trim();
            const listaUl = document.getElementById('lista-resultados');
            const divContador = document.getElementById('contador-resultados');
            
            listaUl.innerHTML = '';
            divContador.innerHTML = '';

            if (!inputLetras) {
                alert("Por favor, digite as letras de entrada!");
                return;
            }

            const entradaLimpa = removerAcentos(inputLetras).toLowerCase();
            const contadorEntrada = criarContador(entradaLimpa);
            
            // Coleta as posições fixas
            let posicoesFixas = [];
            if (tamanhoSelecionado !== null) {
                for (let i = 0; i < tamanhoSelecionado; i++) {
                    const val = document.getElementById(`pos_${i}`).value.trim().toLowerCase();
                    posicoesFixas[i] = val || null;
                }
            }

            const resultados = [];

            for (let item of listaPalavras) {
                // 1. Filtro de tamanho
                if (tamanhoSelecionado !== null && item.tamanho !== tamanhoSelecionado) {
                    continue;
                }
                if (tamanhoSelecionado === null && item.tamanho > entradaLimpa.length) {
                    continue;
                }

                // 2. Se houver posições fixas, valida se a palavra cumpre a posição EXATAMENTE
                if (tamanhoSelecionado !== null) {
                    let batePosicao = true;
                    for (let i = 0; i < tamanhoSelecionado; i++) {
                        if (posicoesFixas[i] !== null && item.limpa[i] !== posicoesFixas[i]) {
                            batePosicao = false;
                            break;
                        }
                    }
                    if (!batePosicao) continue;
                }

                // 3. Validação rigorosa do estoque de letras (Entrada do usuário)
                // Usamos o contador da entrada pura para garantir que nenhuma letra ultrapasse o limite digitado.
                let possivel = true;
                const contadorPalavra = item.contador; // Contador da palavra do dicionário

                for (let letra in contadorPalavra) {
                    if (contadorPalavra[letra] > (contadorEntrada[letra] || 0)) {
                        possivel = false;
                        break;
                    }
                }
                if (!possivel) continue;

                resultados.push(item.original);
            }

            // Ordena do maior para o menor tamanho (ou alfabética se for do mesmo tamanho)
            resultados.sort((a, b) => b.length - a.length || a.localeCompare(b));

            divContador.innerHTML = `Encontradas <strong>${resultados.length}</strong> palavras.`;
            
            for (let palavra of resultados) {
                const li = document.createElement('li');
                li.textContent = palavra;
                listaUl.appendChild(li);
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            carregarDicionario();
            document.getElementById('input-letras').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') executarBusca();
            });
        });
    </script>
</body>
</html>
