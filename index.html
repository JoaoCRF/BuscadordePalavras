<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Buscador Avançado de Palavras</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Estilos adicionais específicos para a nova função de posição */
        .posicoes-container {
            display: flex;
            gap: 5px;
            justify-content: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        .input-posicao {
            width: 30px;
            height: 30px;
            text-align: center;
            font-size: 18px;
            text-transform: uppercase;
            border: 2px solid #ccc;
            border-radius: 4px;
        }
        .input-posicao:focus {
            border-color: #007BFF;
            outline: none;
        }
        .instrucao {
            font-size: 0.9em;
            color: #666;
            text-align: center;
            margin-bottom: 5px;
        }
        /* Destaque para o input principal */
        #input-letras {
            font-weight: bold;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Buscador Avançado</h1>
        
        <div id="status-carregamento" class="contador">Carregando dicionário... Aguarde.</div>

        <div id="busca-container" style="display: none;">
            
            <!-- Área de Entrada de Letras (Igual antes) -->
            <div class="form-grupo">
                <input type="text" id="input-letras" placeholder="EX: VAIAS (Letras disponíveis)" maxlength="7" autocomplete="off">
            </div>

            <!-- Nova Área de Posicionamento (Opcional) -->
            <div class="instrucao">Opcional: Digite as letras nas posições exatas (ex: _ A _ _ _)</div>
            <div class="posicoes-container">
                <input type="text" class="input-posicao" maxlength="1" oninput="moverFoco(this)" id="pos0">
                <input type="text" class="input-posicao" maxlength="1" oninput="moverFoco(this)" id="pos1">
                <input type="text" class="input-posicao" maxlength="1" oninput="moverFoco(this)" id="pos2">
                <input type="text" class="input-posicao" maxlength="1" oninput="moverFoco(this)" id="pos3">
                <input type="text" class="input-posicao" maxlength="1" oninput="moverFoco(this)" id="pos4">
                <input type="text" class="input-posicao" maxlength="1" oninput="moverFoco(this)" id="pos5">
                <input type="text" class="input-posicao" maxlength="1" oninput="moverFoco(this)" id="pos6">
            </div>

            <div class="form-grupo">
                <button id="btn-buscar" onclick="executarBusca()">Buscar</button>
            </div>

            <!-- Filtros de Tamanho (Igual antes) -->
            <div id="filtros-tamanho" class="filtros-container" style="display: none;">
                <span>Filtrar tamanho:</span>
                <button class="filtro-btn ativo" onclick="filtrarTamanho('todas', this)">Todas</button>
                <button class="filtro-btn" onclick="filtrarTamanho(3, this)">3</button>
                <button class="filtro-btn" onclick="filtrarTamanho(4, this)">4</button>
                <button class="filtro-btn" onclick="filtrarTamanho(5, this)">5</button>
                <button class="filtro-btn" onclick="filtrarTamanho(6, this)">6</button>
                <button class="filtro-btn" onclick="filtrarTamanho(7, this)">7</button>
            </div>

            <div id="contador-resultados" class="contador"></div>
            <ul id="lista-resultados"></ul>
        </div>
    </div>

    <script>
        let listaPalavras = [];
        let resultadosAtuais = []; 
        let tamanhoFiltroAtual = 'todas';

        // =====================================================================
        // 📂 EDIÇÃO DO ARQUIVO: Mantenha o nome do seu arquivo aqui
        // =====================================================================
        const NOME_DO_ARQUIVO = "palavras.txt"; 

        function removerAcentos(texto) {
            return texto.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
        }

        async function carregarDicionario() {
            try {
                const resposta = await fetch(NOME_DO_ARQUIVO);
                if (!resposta.ok) throw new Error("Arquivo não encontrado");
                
                const texto = await resposta.text();
                // Divide por quebra de linha, suportando \n e \r\n
                const linhas = texto.split(/\r?\n/);

                for (let linha of linhas) {
                    const original = linha.trim();
                    if (original) {
                        const limpa = removerAcentos(original).toLowerCase();
                        listaPalavras.push({
                            original: original,
                            limpa: limpa,
                            contador: criarContador(limpa),
                            tamanho: limpa.length
                        });
                    }
                }

                document.getElementById('status-carregamento').style.display = 'none';
                document.getElementById('busca-container').style.display = 'block';
                document.getElementById('input-letras').focus();
            } catch (erro) {
                document.getElementById('status-carregamento').innerText = 
                    "Erro ao carregar o arquivo. Verifique se 'palavras.txt' está na pasta e o site está online.";
                console.error(erro);
            }
        }

        function criarContador(palavra) {
            const contador = {};
            for (let char of palavra) {
                contador[char] = (contador[char] || 0) + 1;
            }
            return contador;
        }

        // Função para mover o foco automaticamente ao digitar nas caixas de posição
        function moverFoco(atual) {
            if (atual.value.length >= 1) {
                let proximo = atual.nextElementSibling;
                if (proximo) {
                    proximo.focus();
                }
            }
        }

        // Função de busca principal (modificada para aceitar posições)
        function executarBusca() {
            const inputLetras = document.getElementById('input-letras').value.trim();
            
            // Coleta as letras das posições
            let padraoPosicoes = [];
            let temPosicionamento = false;
            for (let i = 0; i < 7; i++) {
                letletra = document.getElementById(`pos${i}`).value.trim().toLowerCase();
                padraoPosicoes[i] = letra || null;
                if (letra) temPosicionamento = true;
            }

            resultadosAtuais = [];
            
            // Se não digitou nada, limpa tudo
            if (!inputLetras && !temPosicionamento) {
                document.getElementById('filtros-tamanho').style.display = 'none';
                exibirResultados();
                return;
            }

            const entradaLimpa = removerAcentos(inputLetras).toLowerCase();
            // Conta as letras disponíveis (input principal + letras fixadas nas posições)
            const letrasTotaisDisponiveis = entradaLimpa + padraoPosicoes.join('').replace(/null/g, '');
            const contadorDisponiveis = criarContador(letrasTotaisDisponiveis);

            for (let item of listaPalavras) {
                // 1. Filtro de Tamanho Básico (não pode ser maior que o input principal, 
                //    e se tem posições, o tamanho deve ser exatamente o número de posições preenchidas)
                
                let tamanhoMinimoNecessario = 0;
                let ultimaposiçãoPreenchida = -1;
                for(let i=0; i<7; i++) { if(padraoPosicoes[i]) { tamanhoMinimoNecessario = i + 1; ultimaposiçãoPreenchida = i; } }

                if (item.tamanho > entradaLimpa.length + (temPosicionamento ? 0 : 0)) {
                     // Regra complexa: se tem posição fixa, o tamanho da palavra não pode exceder a lógica
                }
                
                // Simplificando: Se tem posição fixa, o tamanho da palavra é definido pela última posição preenchida
                if (temPosicionamento && item.tamanho < tamanhoMinimoNecessario) continue;
                if (!temPosicionamento && item.tamanho > entradaLimpa.length) continue;
                if (temPosicionamento && item.tamanho > 7) continue; // Nosso limite de UI


                // 2. Verifica Compatibilidade de Letras (incluindo as letras nas posições)
                let possivel = true;
                let contadorPalavra = { ...item.contador }; // Clona o contador

                for (let letra in contadorPalavra) {
                    if (contadorPalavra[letra] > (contadorDisponiveis[letra] || 0)) {
                        possivel = false;
                        break;
                    }
                }
                if (!possivel) continue;

                // 3. Verifica restrição de Posição (se houver)
                if (temPosicionamento) {
                    for (let i = 0; i < 7; i++) {
                        if (padraoPosicoes[i] && item.limpa[i] !== padraoPosicoes[i]) {
                            possivel = false;
                            break;
                        }
                    }
                    if (!possivel) continue;
                }

                // Se passou em tudo, adiciona
                resultadosAtuais.push(item.original);
            }

            // Ordena do maior para o menor tamanho por padrão
            resultadosAtuais.sort((a, b) => b.length - a.length);

            // Mostra a barra de filtros e reseta para "Todas"
            document.getElementById('filtros-tamanho').style.display = 'flex';
            resetarBotoesFiltro();
            tamanhoFiltroAtual = 'todas';

            exibirResultados();
        }

        function filtrarTamanho(tamanho, elementoBotao) {
            tamanhoFiltroAtual = tamanho;
            const botoes = document.querySelectorAll('.filtro-btn');
            botoes.forEach(b => b.classList.remove('ativo'));
            elementoBotao.classList.add('ativo');
            exibirResultados();
        }

        function resetarBotoesFiltro() {
            const botoes = document.querySelectorAll('.filtro-btn');
            botoes.forEach((b, idx) => {
                if (idx === 0) b.classList.add('ativo');
                else b.classList.remove('ativo');
            });
        }

        function exibirResultados() {
            const listaUl = document.getElementById('lista-resultados');
            const divContador = document.getElementById('contador-resultados');
            listaUl.innerHTML = '';

            let listaFiltrada = resultadosAtuais;
            if (tamanhoFiltroAtual !== 'todas') {
                listaFiltrada = resultadosAtuais.filter(p => p.length === Number(tamanhoFiltroAtual));
            }

            divContador.innerHTML = `Encontradas <strong>${listaFiltrada.length}</strong> palavras.`;
            for (let palavra of listaFiltrada) {
                const li = document.createElement('li');
                li.textContent = palavra;
                listaUl.appendChild(li);
            }
        }

        // Adiciona suporte ao Enter e foca no input principal
        document.addEventListener("DOMContentLoaded", () => {
            carregarDicionario();
            document.getElementById('input-letras').addEventListener('keypress', (e) => { if(e.key==='Enter') executarBusca(); });
        });
    </script>
</body>
</html>
