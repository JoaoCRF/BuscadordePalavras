<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Buscador de Palavras</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Buscador de Palavras</h1>
        
        <div id="status-carregamento" class="contador">Carregando dicionário... Aguarde.</div>

        <div id="busca-container" style="display: none;">
            <div class="form-grupo">
                <input type="text" id="input-letras" placeholder="Ex: CAOVALO" maxlength="7" autocomplete="off">
                <button id="btn-buscar" onclick="executarBusca()">Buscar</button>
            </div>

            <!-- Filtros de Quantidade de Letras -->
            <div id="filtros-tamanho" class="filtros-container" style="display: none;">
                <span>Filtrar por tamanho:</span>
                <button class="filtro-btn ativo" onclick="filtrarTamanho('todas', this)">Todas</button>
                <button class="filtro-btn" onclick="filtrarTamanho(3, this)">3</button>
                <button class="filtro-btn" onclick="filtrarTamanho(4, this)">4</button>
                <button class="filtro-btn" onclick="filtrarTamanho(5, this)">5</button>
                <button class="filtro-btn" onclick="filtrarTamanho(6, this)">6</button>
                <button class="filtro-btn" onclick="filtrarTamanho(7, this)">7</button>
            </div>

            <div id="contador-resultados" class="contador"></div>
            <ul id="lista-resultados"></ul>
        </div>
    </div>

    <script>
        let listaPalavras = [];
        let resultadosAtuais = []; // Armazena os resultados da última busca
        let tamanhoFiltroAtual = 'todas';

        // =====================================================================
        // 📂 EDIÇÃO DO ARQUIVO: Altere o nome/caminho do arquivo .txt aqui embaixo
        // =====================================================================
        const NOME_DO_ARQUIVO = "palavras.txt"; // <--- Mude aqui se necessário

        function removerAcentos(texto) {
            return texto.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
        }

        async function carregarDicionario() {
            try {
                const resposta = await fetch(NOME_DO_ARQUIVO);
                if (!resposta.ok) throw new Error("Arquivo não encontrado");
                
                const texto = await resposta.text();
                const linhas = texto.split('\n');

                for (let linha of linhas) {
                    const original = linha.trim();
                    if (original) {
                        const limpa = removerAcentos(original).toLowerCase();
                        listaPalavras.push({
                            original: original,
                            limpa: limpa,
                            contador: criarContador(limpa)
                        });
                    }
                }

                document.getElementById('status-carregamento').style.display = 'none';
                document.getElementById('busca-container').style.display = 'block';
                document.getElementById('input-letras').focus();
            } catch (erro) {
                document.getElementById('status-carregamento').innerText = 
                    "Erro ao carregar o arquivo. Verifique se o arquivo 'palavras.txt' está na pasta.";
                console.error(erro);
            }
        }

        function criarContador(palavra) {
            const contador = {};
            for (let char of palavra) {
                contador[char] = (contador[char] || 0) + 1;
            }
            return contador;
        }

        function criarContadorTexto(texto) {
            const contador = {};
            for (let char of texto) {
                contador[char] = (contador[char] || 0) + 1;
            }
            return contador;
        }

        function executarBusca() {
            const inputVal = document.getElementById('input-letras').value.trim();
            
            resultadosAtuais = [];
            if (!inputVal) {
                document.getElementById('filtros-tamanho').style.display = 'none';
                exibirResultados();
                return;
            }

            const entradaLimpa = removerAcentos(inputVal).toLowerCase();
            const letrasUsuarioContador = criarContadorTexto(entradaLimpa);

            for (let item of listaPalavras) {
                if (item.limpa.length <= entradaLimpa.length) {
                    let possivel = true;
                    for (let letra in item.contador) {
                        if (item.contador[letra] > (letrasUsuarioContador[letra] || 0)) {
                            possivel = false;
                            break;
                        }
                    }
                    if (possivel) {
                        resultadosAtuais.push(item.original);
                    }
                }
            }

            // Ordena do maior para o menor tamanho por padrão
            resultadosAtuais.sort((a, b) => b.length - a.length);

            // Mostra a barra de filtros já resetada para "Todas"
            document.getElementById('filtros-tamanho').style.display = 'flex';
            resetarBotoesFiltro();
            tamanhoFiltroAtual = 'todas';

            exibirResultados();
        }

        function filtrarTamanho(tamanho, elementoBotao) {
            tamanhoFiltroAtual = tamanho;

            // Atualiza visual dos botões
            const botoes = document.querySelectorAll('.filtro-btn');
            botoes.forEach(b => b.classList.remove('ativo'));
            elementoBotao.classList.add('ativo');

            exibirResultados();
        }

        function resetarBotoesFiltro() {
            const botoes = document.querySelectorAll('.filtro-btn');
            botoes.forEach((b, idx) => {
                if (idx === 0) b.classList.add('ativo');
                else b.classList.remove('ativo');
            });
        }

        function exibirResultados() {
            const listaUl = document.getElementById('lista-resultados');
            const divContador = document.getElementById('contador-resultados');
            
            listaUl.innerHTML = '';

            // Aplica o filtro de tamanho se não for 'todas'
            let listaFiltrada = resultadosAtuais;
            if (tamanhoFiltroAtual !== 'todas') {
                listaFiltrada = resultadosAtuais.filter(p => p.length === Number(tamanhoFiltroAtual));
            }

            divContador.innerHTML = `Encontradas <strong>${listaFiltrada.length}</strong> palavras.`;
            
            for (let palavra of listaFiltrada) {
                const li = document.createElement('li');
                li.textContent = palavra;
                listaUl.appendChild(li);
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            carregarDicionario();
            document.getElementById('input-letras').addEventListener('keypress', function (e) {
                if (e.key === 'Enter') {
                    executarBusca();
                }
            });
        });
    </script>
</body>
</html>
